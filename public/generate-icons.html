<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate PWA Icons - Heart Link Surat</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #0f172a;
      color: white;
    }
    canvas {
      border: 2px solid #334155;
      margin: 10px;
      background: white;
    }
    button {
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      background: #0369a1;
    }
    .icon-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 20px 0;
    }
    .icon-item {
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🎨 Heart Link Surat - PWA Icon Generator</h1>
  <p>This page generates the required PWA icons. Click the buttons below to generate and download the icons.</p>
  
  <div>
    <button onclick="generateIcons()">Generate All Icons</button>
    <button onclick="downloadAll()">Download All Icons</button>
  </div>

  <div class="icon-preview" id="preview"></div>

  <script>
    const icons = []

    function generateIcons() {
      const sizes = [192, 512]
      const preview = document.getElementById('preview')
      preview.innerHTML = ''
      icons.length = 0

      sizes.forEach(size => {
        const canvas = document.createElement('canvas')
        canvas.width = size
        canvas.height = size
        const ctx = canvas.getContext('2d')
        
        // Background gradient
        const gradient = ctx.createLinearGradient(0, 0, size, size)
        gradient.addColorStop(0, '#0284c7')
        gradient.addColorStop(1, '#0ea5e9')
        ctx.fillStyle = gradient
        ctx.fillRect(0, 0, size, size)
        
        // Phone icon
        ctx.fillStyle = 'white'
        ctx.save()
        ctx.translate(size / 2, size / 2)
        const iconSize = size * 0.5
        ctx.scale(iconSize / 24, iconSize / 24)
        
        // Draw phone handset
        ctx.beginPath()
        ctx.roundRect(-8, -12, 16, 24, 3)
        ctx.fill()
        
        ctx.restore()
        
        // Add to preview
        const item = document.createElement('div')
        item.className = 'icon-item'
        item.innerHTML = `<div>${size}x${size}</div>`
        item.appendChild(canvas)
        preview.appendChild(item)
        
        // Store for download
        icons.push({
          canvas: canvas,
          size: size,
          filename: `icon-${size}x${size}.png`
        })
      })

      // Generate apple touch icon
      generateAppleTouchIcon()
    }

    function generateAppleTouchIcon() {
      const size = 180
      const canvas = document.createElement('canvas')
      canvas.width = size
      canvas.height = size
      const ctx = canvas.getContext('2d')
      
      // Background
      const gradient = ctx.createLinearGradient(0, 0, size, size)
      gradient.addColorStop(0, '#0284c7')
      gradient.addColorStop(1, '#0ea5e9')
      ctx.fillStyle = gradient
      ctx.fillRect(0, 0, size, size)
      
      // Icon
      ctx.fillStyle = 'white'
      ctx.save()
      ctx.translate(size / 2, size / 2)
      const iconSize = size * 0.5
      ctx.scale(iconSize / 24, iconSize / 24)
      ctx.beginPath()
      ctx.roundRect(-8, -12, 16, 24, 3)
      ctx.fill()
      ctx.restore()
      
      const item = document.createElement('div')
      item.className = 'icon-item'
      item.innerHTML = `<div>apple-touch-icon (180x180)</div>`
      item.appendChild(canvas)
      document.getElementById('preview').appendChild(item)
      
      icons.push({
        canvas: canvas,
        size: size,
        filename: 'apple-touch-icon.png'
      })
    }

    function downloadAll() {
      if (icons.length === 0) {
        alert('Please generate icons first!')
        return
      }

      icons.forEach(({ canvas, filename }) => {
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob)
          const link = document.createElement('a')
          link.href = url
          link.download = filename
          document.body.appendChild(link)
          link.click()
          document.body.removeChild(link)
          URL.revokeObjectURL(url)
        }, 'image/png')
      })
    }

    // Auto-generate on load
    window.onload = () => {
      generateIcons()
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function (location) {
        var repoName = 'heartlink-surat'
        var repoBasePath = '/' + repoName + '/'
        var isProjectPage = location.pathname === '/' + repoName || location.pathname.startsWith(repoBasePath)
        var basePath = isProjectPage ? repoBasePath : '/'
        var relativePath = isProjectPage
          ? location.pathname.slice(basePath.length)
          : location.pathname.slice(1)
        var redirectPath = '/' + relativePath.replace(/&/g, '~and~')
        var redirectSearch = location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : ''
        var port = location.port ? ':' + location.port : ''

        location.replace(
          location.protocol + '//' + location.hostname + port + basePath + '?' + redirectPath + redirectSearch + location.hash
        )
      })(window.location)
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
